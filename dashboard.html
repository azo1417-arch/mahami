<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مهامي — لوحة المهام الفخمة</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --gold: #d4af37;
  --gold-light: #f4e4c1;
  --dark-navy: #0a0e27;
  --navy: #1a1f3a;
  --navy-light: #2d3561;
  --purple: #6c63ff;
  --purple-dark: #5a52cc;
  --pink: #ff006e;
  --cyan: #00d9ff;
  --emerald: #10b981;
  --coral: #ff6b6b;
  --text-primary: #f5f7fa;
  --text-secondary: #a8b2c1;
  --text-tertiary: #7a8399;
  --glass: rgba(255,255,255,0.05);
  --glass-hover: rgba(255,255,255,0.08);
  --transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
}

* { margin:0; padding:0; box-sizing:border-box; }

html, body {
  width:100%;
  height:100%;
  overflow-x:hidden;
}

body {
  font-family:'Tajawal',sans-serif;
  background:linear-gradient(135deg, var(--dark-navy) 0%, #0f1535 50%, #1a0033 100%);
  color:var(--text-primary);
  min-height:100vh;
  position:relative;
  background-attachment:fixed;
}

body::before {
  content:'';
  position:fixed;
  top:-50%;
  right:-50%;
  width:200%;
  height:200%;
  background:radial-gradient(circle at 20% 50%, rgba(108,99,255,0.15) 0%, transparent 50%),
             radial-gradient(circle at 80% 80%, rgba(255,0,110,0.15) 0%, transparent 50%),
             radial-gradient(circle at 40% 20%, rgba(0,217,255,0.1) 0%, transparent 50%);
  pointer-events:none;
  z-index:0;
  animation:drift 20s infinite linear;
}

@keyframes drift {
  0% { transform:translate(0, 0); }
  100% { transform:translate(50px, 50px); }
}

body::after {
  content:'';
  position:fixed;
  inset:0;
  background:radial-gradient(circle at center, transparent 0%, rgba(0,0,0,0.3) 100%);
  pointer-events:none;
  z-index:0;
}

.header {
  position:sticky;
  top:0;
  z-index:50;
  padding:28px 48px;
  background:linear-gradient(180deg, rgba(10,14,39,0.95) 0%, rgba(26,31,58,0.9) 100%);
  backdrop-filter:blur(40px);
  border-bottom:1px solid rgba(212,175,55,0.15);
  display:flex;
  align-items:center;
  gap:32px;
  justify-content:space-between;
  box-shadow:0 20px 60px rgba(0,0,0,0.5);
}

.logo-brand {
  display:flex;
  align-items:center;
  gap:20px;
  position:relative;
  z-index:2;
}

.logo-icon {
  width:64px;
  height:64px;
  border-radius:16px;
  background:linear-gradient(135deg, var(--gold) 0%, var(--gold-light) 100%);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:36px;
  box-shadow:0 15px 40px rgba(212,175,55,0.4), inset 0 1px 0 rgba(255,255,255,0.3);
  border:2px solid rgba(212,175,55,0.3);
}

.logo-text h1 {
  font-size:28px;
  font-weight:800;
  letter-spacing:-1.5px;
  background:linear-gradient(135deg, var(--gold) 0%, var(--text-primary) 100%);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
  font-family:'Playfair Display',serif;
}

.logo-text p {
  font-size:11px;
  color:var(--text-tertiary);
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:2px;
}

.header-controls {
  display:flex;
  align-items:center;
  gap:24px;
  margin-left:auto;
  position:relative;
  z-index:2;
}

.search-container {
  position:relative;
  width:340px;
}

.search-input {
  width:100%;
  background:linear-gradient(135deg, var(--glass) 0%, var(--glass-hover) 100%);
  border:2px solid rgba(212,175,55,0.2);
  border-radius:12px;
  padding:14px 20px 14px 50px;
  color:var(--text-primary);
  font-family:'Tajawal',sans-serif;
  font-size:14px;
  outline:none;
  transition:var(--transition);
  backdrop-filter:blur(10px);
  direction:rtl;
}

.search-input::placeholder {
  color:var(--text-tertiary);
}

.search-input:focus {
  background:linear-gradient(135deg, rgba(108,99,255,0.15) 0%, rgba(108,99,255,0.1) 100%);
  border-color:var(--purple);
  box-shadow:0 0 0 4px rgba(108,99,255,0.2);
}

.search-icon {
  position:absolute;
  right:18px;
  top:50%;
  transform:translateY(-50%);
  font-size:18px;
  opacity:0.6;
  pointer-events:none;
}

.btn-luxury {
  background:linear-gradient(135deg, var(--gold) 0%, var(--gold-light) 100%);
  border:none;
  border-radius:12px;
  padding:12px 32px;
  color:var(--dark-navy);
  font-family:'Tajawal',sans-serif;
  font-size:13px;
  font-weight:800;
  cursor:pointer;
  transition:var(--transition);
  box-shadow:0 12px 40px rgba(212,175,55,0.35);
  display:flex;
  align-items:center;
  gap:10px;
  white-space:nowrap;
  text-transform:uppercase;
  letter-spacing:1px;
  border:2px solid rgba(212,175,55,0.2);
}

.btn-luxury:hover {
  transform:translateY(-3px);
  box-shadow:0 18px 60px rgba(212,175,55,0.5);
  border-color:rgba(212,175,55,0.5);
}

.btn-luxury:active {
  transform:translateY(-1px);
}

.btn-icon {
  width:44px;
  height:44px;
  border-radius:12px;
  border:2px solid rgba(212,175,55,0.2);
  background:linear-gradient(135deg, var(--glass) 0%, var(--glass-hover) 100%);
  color:var(--gold);
  cursor:pointer;
  font-size:18px;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:var(--transition);
  backdrop-filter:blur(10px);
}

.btn-icon:hover {
  background:linear-gradient(135deg, var(--glass-hover) 0%, rgba(212,175,55,0.15) 100%);
  border-color:var(--gold);
  transform:scale(1.08);
}

.premium-stats {
  padding:48px;
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(220px, 1fr));
  gap:24px;
  position:relative;
  z-index:2;
  max-width:1400px;
  margin:0 auto;
}

.stat-box {
  background:linear-gradient(135deg, var(--glass) 0%, var(--glass-hover) 100%);
  border:2px solid rgba(212,175,55,0.15);
  border-radius:16px;
  padding:32px;
  cursor:pointer;
  transition:var(--transition);
  position:relative;
  overflow:hidden;
  backdrop-filter:blur(10px);
  display:flex;
  flex-direction:column;
  gap:14px;
}

.stat-box::before {
  content:'';
  position:absolute;
  top:0;
  left:0;
  right:0;
  height:3px;
  background:linear-gradient(90deg, var(--gold), var(--purple), transparent);
  opacity:0;
  transition:var(--transition);
}

.stat-box::after {
  content:'';
  position:absolute;
  inset:0;
  background:radial-gradient(circle at 100% 100%, rgba(212,175,55,0.1) 0%, transparent 70%);
  pointer-events:none;
  opacity:0;
  transition:var(--transition);
}

.stat-box:hover {
  background:linear-gradient(135deg, rgba(108,99,255,0.15) 0%, rgba(212,175,55,0.1) 100%);
  border-color:var(--gold);
  transform:translateY(-8px);
  box-shadow:0 20px 60px rgba(212,175,55,0.25);
}

.stat-box:hover::before {
  opacity:1;
}

.stat-box:hover::after {
  opacity:1;
}

.stat-box.active {
  background:linear-gradient(135deg, rgba(212,175,55,0.15) 0%, rgba(212,175,55,0.1) 100%);
  border-color:var(--gold);
  box-shadow:0 0 0 1px var(--gold), 0 20px 60px rgba(212,175,55,0.3);
}

.stat-label {
  font-size:12px;
  color:var(--text-tertiary);
  text-transform:uppercase;
  letter-spacing:2px;
  font-weight:700;
}

.stat-number {
  font-size:48px;
  font-weight:900;
  letter-spacing:-2px;
  background:linear-gradient(135deg, var(--gold) 0%, var(--text-primary) 100%);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
  font-family:'Playfair Display',serif;
}

.stat-desc {
  font-size:13px;
  color:var(--text-secondary);
  font-weight:500;
}

.main-content {
  position:relative;
  z-index:2;
  padding:0 48px 80px;
  max-width:1400px;
  margin:0 auto;
}

.section-header {
  display:flex;
  align-items:center;
  gap:20px;
  margin-bottom:40px;
  position:relative;
}

.section-icon {
  font-size:44px;
  filter:drop-shadow(0 8px 16px rgba(212,175,55,0.3));
}

.section-title {
  font-size:36px;
  font-weight:900;
  letter-spacing:-1px;
  background:linear-gradient(135deg, var(--gold) 0%, var(--cyan) 100%);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
  font-family:'Playfair Display',serif;
}

.section-divider {
  flex:1;
  height:2px;
  background:linear-gradient(90deg, var(--gold) 0%, transparent);
  opacity:0.4;
}

.tasks-grid {
  display:grid;
  gap:20px;
}

.task-card {
  background:linear-gradient(135deg, var(--glass) 0%, var(--glass-hover) 100%);
  border:2px solid rgba(212,175,55,0.12);
  border-radius:14px;
  padding:28px;
  transition:var(--transition);
  position:relative;
  overflow:hidden;
  display:grid;
  grid-template-columns:auto 1fr auto;
  gap:20px;
  align-items:start;
  backdrop-filter:blur(10px);
}

.task-card::before {
  content:'';
  position:absolute;
  top:0;
  left:0;
  right:0;
  bottom:0;
  background:linear-gradient(135deg, transparent, rgba(212,175,55,0.05));
  opacity:0;
  transition:var(--transition);
}

.task-card:hover {
  background:linear-gradient(135deg, rgba(108,99,255,0.15) 0%, rgba(212,175,55,0.12) 100%);
  border-color:var(--gold);
  transform:translateX(-6px);
  box-shadow:0 16px 48px rgba(212,175,55,0.2);
}

.task-card:hover::before {
  opacity:1;
}

.task-checkbox {
  width:28px;
  height:28px;
  border:2.5px solid var(--gold);
  border-radius:8px;
  background:linear-gradient(135deg, var(--glass) 0%, var(--glass-hover) 100%);
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:var(--transition);
  flex-shrink:0;
  margin-top:4px;
  box-shadow:0 4px 12px rgba(212,175,55,0.15);
  backdrop-filter:blur(10px);
}

.task-checkbox:hover {
  background:linear-gradient(135deg, rgba(212,175,55,0.2) 0%, rgba(212,175,55,0.15) 100%);
  box-shadow:0 8px 20px rgba(212,175,55,0.25);
  transform:scale(1.1);
}

.task-checkbox.done {
  background:linear-gradient(135deg, var(--emerald) 0%, #059669 100%);
  border-color:var(--emerald);
  color:#fff;
  font-size:16px;
  font-weight:bold;
  box-shadow:0 8px 20px rgba(16,185,129,0.3);
}

.task-info {
  display:flex;
  flex-direction:column;
  gap:12px;
  position:relative;
  z-index:1;
}

.task-title {
  font-size:16px;
  font-weight:700;
  color:var(--text-primary);
  line-height:1.5;
  transition:var(--transition);
  letter-spacing:-0.3px;
}

.task-card:hover .task-title {
  color:var(--gold);
}

.task-title.done {
  color:var(--text-tertiary);
  text-decoration:line-through;
  opacity:0.6;
}

.task-metadata {
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  align-items:center;
}

.task-date {
  display:inline-flex;
  align-items:center;
  gap:6px;
  font-size:12px;
  background:linear-gradient(135deg, rgba(108,99,255,0.15) 0%, rgba(108,99,255,0.1) 100%);
  color:var(--text-secondary);
  padding:6px 12px;
  border-radius:8px;
  border:1px solid rgba(108,99,255,0.2);
  transition:var(--transition);
  backdrop-filter:blur(10px);
}

.task-date.overdue {
  background:linear-gradient(135deg, rgba(255,107,107,0.15) 0%, rgba(255,107,107,0.1) 100%);
  color:#ff9999;
  border-color:rgba(255,107,107,0.3);
}

.task-date.today {
  background:linear-gradient(135deg, rgba(0,217,255,0.15) 0%, rgba(0,217,255,0.1) 100%);
  color:#00d9ff;
  border-color:rgba(0,217,255,0.3);
}

.task-date.upcoming {
  background:linear-gradient(135deg, rgba(16,185,129,0.15) 0%, rgba(16,185,129,0.1) 100%);
  color:#86efac;
  border-color:rgba(16,185,129,0.3);
}

.task-type {
  display:inline-flex;
  align-items:center;
  gap:4px;
  font-size:10px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:1.5px;
  padding:5px 10px;
  border-radius:6px;
  background:linear-gradient(135deg, rgba(212,175,55,0.2) 0%, rgba(212,175,55,0.15) 100%);
  color:var(--gold);
  border:1px solid rgba(212,175,55,0.3);
  transition:var(--transition);
  backdrop-filter:blur(10px);
}

.task-actions {
  display:flex;
  gap:8px;
  opacity:0;
  transition:var(--transition);
}

.task-card:hover .task-actions {
  opacity:1;
}

.action-btn {
  width:36px;
  height:36px;
  border-radius:10px;
  border:2px solid rgba(212,175,55,0.2);
  background:linear-gradient(135deg, var(--glass) 0%, var(--glass-hover) 100%);
  color:var(--gold);
  cursor:pointer;
  font-size:16px;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:var(--transition);
  backdrop-filter:blur(10px);
}

.action-btn:hover {
  background:linear-gradient(135deg, rgba(212,175,55,0.2) 0%, rgba(212,175,55,0.15) 100%);
  border-color:var(--gold);
  transform:scale(1.12);
  box-shadow:0 8px 20px rgba(212,175,55,0.25);
}

.action-btn.delete:hover {
  background:linear-gradient(135deg, rgba(255,107,107,0.2) 0%, rgba(255,107,107,0.15) 100%);
  color:#ff9999;
  border-color:rgba(255,107,107,0.3);
  box-shadow:0 8px 20px rgba(255,107,107,0.2);
}

.empty-state {
  text-align:center;
  padding:100px 48px;
  background:linear-gradient(135deg, var(--glass) 0%, var(--glass-hover) 100%);
  border:2px solid rgba(212,175,55,0.15);
  border-radius:16px;
  backdrop-filter:blur(10px);
}

.empty-icon {
  font-size:88px;
  margin-bottom:24px;
  opacity:0.3;
  filter:drop-shadow(0 8px 16px rgba(212,175,55,0.2));
}

.empty-text {
  font-size:24px;
  font-weight:700;
  margin-bottom:12px;
  background:linear-gradient(135deg, var(--text-secondary), var(--text-tertiary));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
}

.empty-desc {
  font-size:14px;
  color:var(--text-tertiary);
}

.modal-overlay {
  position:fixed;
  inset:0;
  background:linear-gradient(135deg, rgba(10,14,39,0.8), rgba(26,31,58,0.8));
  backdrop-filter:blur(12px);
  z-index:100;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal-overlay.show {
  display:flex;
  animation:fadeIn .3s ease;
}

@keyframes fadeIn {
  from { opacity:0; }
  to { opacity:1; }
}

.modal-box {
  background:linear-gradient(135deg, var(--navy) 0%, var(--navy-light) 100%);
  border:2px solid var(--gold);
  border-radius:20px;
  padding:48px;
  width:100%;
  max-width:520px;
  box-shadow:0 40px 100px rgba(0,0,0,0.6), 0 0 0 1px rgba(212,175,55,0.3);
  position:relative;
  overflow:hidden;
  backdrop-filter:blur(10px);
  animation:modalIn .4s ease;
}

@keyframes modalIn {
  from { opacity:0; transform:scale(0.9) translateY(-40px); }
  to { opacity:1; transform:scale(1) translateY(0); }
}

.modal-box::before {
  content:'';
  position:absolute;
  top:0;
  left:0;
  right:0;
  height:2px;
  background:linear-gradient(90deg, transparent, var(--gold), transparent);
}

.modal-header {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:32px;
}

.modal-title {
  font-size:28px;
  font-weight:900;
  background:linear-gradient(135deg, var(--gold), var(--text-primary));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
  font-family:'Playfair Display',serif;
}

.modal-close {
  width:44px;
  height:44px;
  border-radius:12px;
  border:2px solid rgba(212,175,55,0.3);
  background:var(--glass);
  color:var(--gold);
  cursor:pointer;
  font-size:24px;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:var(--transition);
  backdrop-filter:blur(10px);
}

.modal-close:hover {
  background:var(--glass-hover);
  border-color:var(--gold);
  transform:rotate(90deg);
}

.form-group {
  margin-bottom:24px;
}

.form-label {
  display:block;
  font-size:12px;
  font-weight:800;
  color:var(--gold);
  margin-bottom:10px;
  text-transform:uppercase;
  letter-spacing:1.5px;
}

.form-input, .form-select {
  width:100%;
  background:linear-gradient(135deg, var(--glass) 0%, var(--glass-hover) 100%);
  border:2px solid rgba(212,175,55,0.2);
  border-radius:12px;
  padding:14px 18px;
  color:var(--text-primary);
  font-family:'Tajawal',sans-serif;
  font-size:14px;
  outline:none;
  transition:var(--transition);
  backdrop-filter:blur(10px);
  direction:rtl;
}

.form-input:focus, .form-select:focus {
  background:linear-gradient(135deg, rgba(212,175,55,0.15) 0%, rgba(212,175,55,0.1) 100%);
  border-color:var(--gold);
  box-shadow:0 0 0 4px rgba(212,175,55,0.15);
}

.form-row {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
}

.form-row .form-group {
  margin-bottom:0;
}

.submit-btn {
  width:100%;
  background:linear-gradient(135deg, var(--gold) 0%, var(--gold-light) 100%);
  border:none;
  border-radius:12px;
  padding:16px;
  color:var(--dark-navy);
  font-family:'Tajawal',sans-serif;
  font-size:14px;
  font-weight:800;
  cursor:pointer;
  transition:var(--transition);
  box-shadow:0 12px 40px rgba(212,175,55,0.35);
  text-transform:uppercase;
  letter-spacing:1px;
  border:2px solid rgba(212,175,55,0.2);
}

.submit-btn:hover {
  transform:translateY(-3px);
  box-shadow:0 18px 60px rgba(212,175,55,0.5);
  border-color:rgba(212,175,55,0.5);
}

.toast-notification {
  position:fixed;
  bottom:40px;
  right:40px;
  background:linear-gradient(135deg, var(--glass) 0%, var(--glass-hover) 100%);
  border:2px solid var(--gold);
  border-radius:12px;
  padding:18px 28px;
  color:var(--gold);
  font-size:14px;
  z-index:200;
  box-shadow:0 20px 60px rgba(212,175,55,0.3);
  display:none;
  align-items:center;
  gap:12px;
  backdrop-filter:blur(10px);
  animation:toastSlide .4s ease;
}

@keyframes toastSlide {
  from { opacity:0; transform:translateX(40px) translateY(40px); }
  to { opacity:1; transform:translateX(0) translateY(0); }
}

.toast-notification.show {
  display:flex;
}

::-webkit-scrollbar {
  width:10px;
}

::-webkit-scrollbar-track {
  background:transparent;
}

::-webkit-scrollbar-thumb {
  background:linear-gradient(180deg, var(--gold), var(--purple));
  border-radius:5px;
}

::-webkit-scrollbar-thumb:hover {
  box-shadow:0 0 0 1px rgba(212,175,55,0.3);
}
</style>
</head>
<body>

<div class="header">
  <div class="logo-brand">
    <div class="logo-icon">📋</div>
    <div class="logo-text">
      <h1>مهامي</h1>
      <p>لوحة المهام الفخمة</p>
    </div>
  </div>

  <div class="header-controls">
    <div class="search-container">
      <span class="search-icon">🔍</span>
      <input type="text" class="search-input" id="searchInput" placeholder="ابحث عن مهمة..." oninput="filterTasks()">
    </div>
    <button class="btn-icon" onclick="location.href='/kanban'" title="Kanban">📋</button>
    <button class="btn-luxury" onclick="openNewTaskModal()">✨ مهمة جديدة</button>
  </div>
</div>

<div class="premium-stats">
  <div class="stat-box active" onclick="setFilter('all')">
    <div class="stat-label">🎯 الكل</div>
    <div class="stat-number" id="stat-all">0</div>
    <div class="stat-desc">كل المهام</div>
  </div>

  <div class="stat-box" onclick="setFilter('today')">
    <div class="stat-label">📌 اليوم</div>
    <div class="stat-number" id="stat-today">0</div>
    <div class="stat-desc">مهام اليوم</div>
  </div>

  <div class="stat-box" onclick="setFilter('overdue')">
    <div class="stat-label">⚠️ متأخرة</div>
    <div class="stat-number" id="stat-overdue">0</div>
    <div class="stat-desc">تحتاج عاجل</div>
  </div>

  <div class="stat-box" onclick="setFilter('done')">
    <div class="stat-label">✅ منجزة</div>
    <div class="stat-number" id="stat-done">0</div>
    <div class="stat-desc">مكتملة</div>
  </div>
</div>

<div class="main-content">
  <div class="section-header">
    <div class="section-icon">📋</div>
    <h2 class="section-title">مهام اليوم</h2>
    <div class="section-divider"></div>
  </div>

  <div class="tasks-grid" id="tasksContainer"></div>
</div>

<div class="modal-overlay" id="taskModal" onclick="closeModalBg(event)">
  <div class="modal-box" onclick="event.stopPropagation()">
    <div class="modal-header">
      <h3 class="modal-title">✨ مهمة جديدة</h3>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>

    <div class="form-group">
      <label class="form-label">العنوان</label>
      <input type="text" class="form-input" id="f-title" placeholder="عنوان المهمة...">
    </div>

    <div class="form-row">
      <div class="form-group">
        <label class="form-label">النوع</label>
        <select class="form-select" id="f-type">
          <option value="task">مهمة</option>
          <option value="meeting">اجتماع</option>
          <option value="reminder">تذكير</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">الأولوية</label>
        <select class="form-select" id="f-priority">
          <option value="low">منخفضة</option>
          <option value="normal">عادية</option>
          <option value="high">عالية</option>
        </select>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label class="form-label">التاريخ</label>
        <input type="date" class="form-input" id="f-date">
      </div>
      <div class="form-group">
        <label class="form-label">الوقت</label>
        <input type="time" class="form-input" id="f-time">
      </div>
    </div>

    <button class="submit-btn" onclick="submitTask()">إضافة المهمة</button>
  </div>
</div>

<div class="toast-notification" id="toast"></div>

<script>
const API = window.location.origin;
let allTasks = [];
let currentFilter = 'all';
let searchQuery = '';

async function loadTasks() {
  try {
    const res = await fetch(API + '/tasks');
    allTasks = await res.json();
    updateStats();
    renderTasks();
  } catch(e) {
    console.error('Error:', e);
  }
}

function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function updateStats() {
  const today = todayStr();
  const pending = allTasks.filter(t => !t.done);
  const todayTasks = pending.filter(t => t.date === today);
  const overdue = pending.filter(t => t.date && t.date < today);
  const done = allTasks.filter(t => t.done);

  document.getElementById('stat-all').textContent = allTasks.length;
  document.getElementById('stat-today').textContent = todayTasks.length;
  document.getElementById('stat-overdue').textContent = overdue.length;
  document.getElementById('stat-done').textContent = done.length;
}

function setFilter(f) {
  currentFilter = f;
  document.querySelectorAll('.stat-box').forEach(b => b.classList.remove('active'));
  event.target.closest('.stat-box')?.classList.add('active');
  renderTasks();
}

function filterTasks() {
  searchQuery = document.getElementById('searchInput').value.toLowerCase();
  renderTasks();
}

function getFilteredTasks() {
  let tasks = [...allTasks];
  const today = todayStr();

  if (currentFilter === 'today') {
    tasks = tasks.filter(t => !t.done && t.date === today);
  } else if (currentFilter === 'overdue') {
    tasks = tasks.filter(t => !t.done && t.date && t.date < today);
  } else if (currentFilter === 'done') {
    tasks = tasks.filter(t => t.done);
  } else {
    tasks = tasks.filter(t => !t.done);
  }

  if (searchQuery) {
    tasks = tasks.filter(t => t.title.toLowerCase().includes(searchQuery));
  }

  return tasks;
}

function renderTasks() {
  const tasks = getFilteredTasks();
  const container = document.getElementById('tasksContainer');

  if (tasks.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">📭</div>
        <div class="empty-text">لا توجد مهام</div>
        <div class="empty-desc">ابدأ برفع مهمة جديدة الآن</div>
      </div>`;
    return;
  }

  container.innerHTML = tasks.map(t => {
    const today = todayStr();
    const isOverdue = !t.done && t.date && t.date < today;
    const isToday = t.date === today;
    const isDone = t.done;
    let dateClass = '';
    if (isOverdue) dateClass = 'overdue';
    else if (isToday) dateClass = 'today';
    else if (t.date) dateClass = 'upcoming';

    return `
      <div class="task-card ${isDone?'done':''}">
        <div class="task-checkbox ${isDone?'done':''}" 
          onclick="toggleTask(${t.id}, ${!isDone})"
          title="${isDone?'إلغاء الإنجاز':'إنجاز المهمة'}">
          ${isDone?'✓':''}
        </div>

        <div class="task-info">
          <div class="task-title ${isDone?'done':''}">
            ${t.title}
          </div>
          <div class="task-metadata">
            ${t.date ? `<div class="task-date ${dateClass}">📅 ${t.date.split('-')[2]}/${t.date.split('-')[1]}${t.time?' '+fmt12(t.time):''}}</div>` : ''}
            ${t.type === 'meeting' ? '<div class="task-type">📅 اجتماع</div>' : ''}
            ${t.type === 'reminder' ? '<div class="task-type">🔔 تذكير</div>' : ''}
          </div>
        </div>

        <div class="task-actions">
          <button class="action-btn" onclick="editTask(${t.id})" title="تعديل">✎</button>
          <button class="action-btn delete" onclick="deleteTask(${t.id})" title="حذف">🗑</button>
        </div>
      </div>`;
  }).join('');
}

function fmt12(t) {
  const [h,m] = t.split(':');
  return (h%12||12) + ':' + m + ' ' + (h<12?'ص':'م');
}

async function toggleTask(id, done) {
  await fetch(API + '/tasks/' + id, {
    method:'PATCH',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({done})
  });
  toast(done ? '✅ تم إنجاز المهمة' : '↩️ تم إلغاء الإنجاز');
  loadTasks();
}

async function deleteTask(id) {
  if (!confirm('هل تريد حذف المهمة؟')) return;
  await fetch(API + '/tasks/' + id, {method:'DELETE'});
  toast('🗑 تم الحذف');
  loadTasks();
}

function editTask(id) {
  alert('تعديل: ' + allTasks.find(t => t.id === id)?.title);
}

function openNewTaskModal() {
  document.getElementById('f-title').value = '';
  document.getElementById('f-date').value = todayStr();
  document.getElementById('f-time').value = '';
  document.getElementById('f-type').value = 'task';
  document.getElementById('f-priority').value = 'normal';
  document.getElementById('taskModal').classList.add('show');
  document.getElementById('f-title').focus();
}

function closeModal() {
  document.getElementById('taskModal').classList.remove('show');
}

function closeModalBg(e) {
  if (e.target === e.currentTarget) closeModal();
}

async function submitTask() {
  const title = document.getElementById('f-title').value.trim();
  if (!title) return;

  const task = {
    title,
    type: document.getElementById('f-type').value,
    priority: document.getElementById('f-priority').value,
    date: document.getElementById('f-date').value,
    time: document.getElementById('f-time').value,
    done: false
  };

  await fetch(API + '/tasks', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(task)
  });

  toast('✅ تمت الإضافة بنجاح');
  closeModal();
  loadTasks();
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 3000);
}

loadTasks();
setInterval(loadTasks, 30000);
</script>
</body>
</html>
