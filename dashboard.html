<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إدارة المهام</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #2c5aa0;
  --primary-light: #4a7bc4;
  --accent: #d4a574;
  --light-bg: #f8f9fb;
  --border: #e8ecf1;
  --text-primary: #1a1f3a;
  --text-secondary: #5a6b8a;
  --text-muted: #8a9aaa;
  --success: #27ae60;
  --warning: #f39c12;
  --danger: #e74c3c;
  --shadow: 0 4px 16px rgba(44,90,160,0.08);
}

* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Tajawal',sans-serif; background:var(--light-bg); color:var(--text-primary); min-height:100vh; }

/* HEADER */
.header {
  position:sticky; top:0; z-index:50;
  padding:16px 32px;
  background:#fff;
  border-bottom:2px solid var(--border);
  box-shadow:var(--shadow);
  display:flex; align-items:center; justify-content:space-between; gap:16px;
}

.logo { display:flex; align-items:center; gap:12px; }
.logo-icon {
  width:48px; height:48px; border-radius:12px;
  background:linear-gradient(135deg,var(--primary),var(--primary-light));
  display:flex; align-items:center; justify-content:center;
  font-size:26px; color:#fff; box-shadow:var(--shadow);
}
.logo h1 { font-size:22px; font-weight:800; color:var(--primary); }
.logo p { font-size:11px; color:var(--text-muted); }

.header-actions { display:flex; align-items:center; gap:10px; }

/* زر كبير */
.btn {
  border:none; border-radius:10px; padding:10px 20px;
  font-family:'Tajawal',sans-serif; font-size:15px; font-weight:700;
  cursor:pointer; display:flex; align-items:center; gap:8px;
  transition:all .25s;
}
.btn-primary { background:linear-gradient(135deg,var(--primary),var(--primary-light)); color:#fff; box-shadow:var(--shadow); }
.btn-primary:hover { transform:translateY(-2px); }
.btn-ghost { background:#f0f4fa; color:var(--primary); border:1px solid var(--border); }
.btn-ghost:hover { background:#e0eaf8; }

/* زر أيقونة أكبر */
.icon-btn {
  width:46px; height:46px; border-radius:12px;
  border:1.5px solid var(--border); background:#fff;
  display:flex; align-items:center; justify-content:center;
  font-size:22px; cursor:pointer; transition:all .25s;
  position:relative;
}
.icon-btn:hover { background:#f0f4fa; border-color:var(--primary); transform:scale(1.08); }

/* STATS */
.stats-row {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:14px;
  padding:24px 32px 0;
}
.stat {
  background:#fff; border:1.5px solid var(--border);
  border-radius:14px; padding:18px 20px;
  display:flex; align-items:center; gap:14px;
  box-shadow:var(--shadow); transition:all .25s;
}
.stat:hover { transform:translateY(-2px); border-color:var(--primary); }
.stat-icon { font-size:28px; }
.stat-num { font-size:28px; font-weight:800; }
.stat-label { font-size:12px; color:var(--text-muted); }
.s1 .stat-num { color:var(--primary); }
.s2 .stat-num { color:var(--warning); }
.s3 .stat-num { color:var(--success); }
.s4 .stat-num { color:var(--danger); }

/* TOOLBAR */
.toolbar {
  padding:18px 32px;
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
}
.search-box {
  flex:1; min-width:200px; max-width:320px;
  background:#fff; border:1.5px solid var(--border); border-radius:10px;
  padding:10px 14px; font-family:'Tajawal',sans-serif; font-size:14px;
  outline:none;
}
.search-box:focus { border-color:var(--primary); }
.filter-btns { display:flex; gap:6px; flex-wrap:wrap; }
.fbtn {
  padding:8px 14px; border-radius:8px; border:1.5px solid var(--border);
  background:#fff; font-family:'Tajawal',sans-serif; font-size:13px;
  font-weight:600; cursor:pointer; color:var(--text-secondary); transition:all .2s;
}
.fbtn.active { background:var(--primary); color:#fff; border-color:var(--primary); }
.fbtn:hover:not(.active) { background:#f0f4fa; }

/* BOARD */
.board-wrap { padding:0 32px 40px; overflow-x:auto; }
.board {
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
  gap:24px; align-items:start;
  min-width:0;
}

/* COLUMN */
.column { display:flex; flex-direction:column; gap:12px; }
.col-head {
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 16px; background:#fff;
  border-radius:12px; border:1.5px solid var(--border);
  box-shadow:var(--shadow);
}
.col-head:hover { border-color:var(--primary); }
.col-title { display:flex; align-items:center; gap:10px; flex:1; }
.col-dot { width:14px; height:14px; border-radius:50%; flex-shrink:0; }
.col-name {
  font-size:15px; font-weight:700; flex:1;
  cursor:text; padding:4px 8px; border-radius:6px;
}
.col-name:hover { background:rgba(44,90,160,.07); }
.col-count {
  background:rgba(44,90,160,.1); color:var(--primary);
  padding:2px 10px; border-radius:6px; font-size:12px; font-weight:800;
}
.col-actions { display:flex; gap:6px; opacity:0; transition:.2s; }
.col-head:hover .col-actions { opacity:1; }
.col-btn {
  width:30px; height:30px; border-radius:7px; border:1.5px solid var(--border);
  background:#fff; color:var(--primary); cursor:pointer; font-size:14px;
  display:flex; align-items:center; justify-content:center; transition:.2s;
}
.col-btn:hover { background:#f0f4fa; border-color:var(--primary); }
.col-btn.del:hover { background:#fef0ef; color:var(--danger); border-color:var(--danger); }

/* CARDS */
.cards-area {
  flex:1; display:flex; flex-direction:column; gap:10px;
  min-height:200px; overflow-y:auto;
}
.card {
  background:#fff; border:1.5px solid var(--border);
  border-radius:12px; padding:14px; cursor:grab;
  box-shadow:var(--shadow); transition:all .25s;
  display:flex; flex-direction:column; gap:8px;
}
.card:hover { border-color:var(--primary); transform:translateY(-3px); box-shadow:0 8px 24px rgba(44,90,160,.12); }
.card:active { cursor:grabbing; }
.card-head { display:flex; align-items:start; gap:8px; }
.prio-dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; margin-top:4px; }
.prio-high { background:var(--danger); }
.prio-medium { background:var(--warning); }
.prio-low { background:var(--success); }
.card-title { font-size:14px; font-weight:600; flex:1; line-height:1.4; }
.card:hover .card-title { color:var(--primary); }
.card-del {
  width:24px; height:24px; border-radius:6px; border:1.5px solid var(--border);
  background:#fff; color:var(--text-muted); cursor:pointer; font-size:12px;
  display:flex; align-items:center; justify-content:center;
  opacity:0; transition:.2s; flex-shrink:0;
}
.card:hover .card-del { opacity:1; }
.card-del:hover { background:#fef0ef; color:var(--danger); border-color:var(--danger); }
.card-meta { display:flex; gap:6px; flex-wrap:wrap; }
.tag {
  font-size:11px; padding:2px 8px; border-radius:5px; font-weight:600;
  background:rgba(44,90,160,.08); color:var(--primary);
}

.add-card-btn {
  background:rgba(44,90,160,.06); border:2px dashed var(--border);
  border-radius:10px; padding:12px; text-align:center;
  color:var(--primary); font-size:13px; font-weight:700;
  cursor:pointer; transition:.2s;
}
.add-card-btn:hover { background:rgba(44,90,160,.12); border-color:var(--primary); }

.add-col-btn {
  background:#fff; border:2px dashed var(--border); border-radius:14px;
  padding:40px 20px; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:8px;
  cursor:pointer; transition:.25s; color:var(--primary);
}
.add-col-btn:hover { background:rgba(44,90,160,.05); border-color:var(--primary); }
.add-col-btn span:first-child { font-size:32px; }
.add-col-btn span:last-child { font-size:13px; font-weight:700; }

/* EXPORT MENU */
.export-wrap { position:relative; }
.export-menu {
  position:absolute; top:calc(100% + 8px); left:0;
  background:#fff; border:1.5px solid var(--border); border-radius:12px;
  box-shadow:0 12px 32px rgba(0,0,0,.12); z-index:99;
  min-width:190px; display:none; overflow:hidden;
}
.export-menu.open { display:block; }
.export-item {
  display:flex; align-items:center; gap:12px;
  padding:13px 16px; cursor:pointer; font-size:14px; font-weight:600;
  color:var(--text-primary); border:none; background:transparent;
  width:100%; text-align:right; font-family:'Tajawal',sans-serif;
  transition:.15s;
}
.export-item:hover { background:#f0f4fa; color:var(--primary); }
.export-item span:first-child { font-size:20px; }

/* EMPTY */
.empty { text-align:center; padding:40px 20px; color:var(--text-muted); }
.empty-icon { font-size:44px; margin-bottom:10px; }

/* MODAL */
.overlay {
  position:fixed; inset:0; background:rgba(0,0,0,.28);
  z-index:100; display:none; align-items:center; justify-content:center; padding:20px;
}
.overlay.open { display:flex; }
.modal {
  background:#fff; border-radius:16px; padding:32px;
  width:100%; max-width:480px; box-shadow:0 24px 60px rgba(0,0,0,.16);
  animation:popIn .3s ease;
}
@keyframes popIn { from{opacity:0;transform:scale(.95)} to{opacity:1;transform:scale(1)} }
.modal-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; }
.modal-head h3 { font-size:20px; font-weight:800; color:var(--primary); }
.modal-close {
  width:36px; height:36px; border-radius:8px; border:1.5px solid var(--border);
  background:#fff; cursor:pointer; font-size:18px; display:flex;
  align-items:center; justify-content:center; transition:.2s;
}
.modal-close:hover { background:#f0f4fa; }
.form-group { margin-bottom:16px; }
.form-label { display:block; font-size:11px; font-weight:800; color:var(--primary); margin-bottom:6px; text-transform:uppercase; }
.form-input {
  width:100%; background:#f8f9fb; border:1.5px solid var(--border);
  border-radius:8px; padding:11px 13px; font-family:'Tajawal',sans-serif;
  font-size:13px; outline:none; direction:rtl;
}
.form-input:focus { border-color:var(--primary); background:#fff; }
.color-grid { display:grid; grid-template-columns:repeat(6,1fr); gap:10px; }
.color-opt {
  width:42px; height:42px; border-radius:9px; cursor:pointer;
  border:3px solid transparent; transition:.2s;
}
.color-opt:hover { transform:scale(1.1); }
.color-opt.sel { border-color:var(--primary); box-shadow:0 0 0 2px rgba(44,90,160,.25); }
.submit-btn {
  width:100%; background:linear-gradient(135deg,var(--primary),var(--primary-light));
  border:none; border-radius:10px; padding:13px; color:#fff;
  font-family:'Tajawal',sans-serif; font-size:14px; font-weight:800;
  cursor:pointer; transition:.2s; margin-top:8px;
}
.submit-btn:hover { transform:translateY(-2px); }

/* TOAST */
.toast {
  position:fixed; bottom:28px; left:50%; transform:translateX(-50%) translateY(100px);
  background:#fff; border:1.5px solid var(--border); border-radius:10px;
  padding:12px 22px; font-size:13px; font-weight:600;
  z-index:200; box-shadow:0 8px 24px rgba(0,0,0,.1);
  transition:transform .3s ease;
}
.toast.show { transform:translateX(-50%) translateY(0); }
.toast.ok { border-color:var(--success); color:var(--success); }
.toast.err { border-color:var(--danger); color:var(--danger); }

/* DRAG */
.drag-over { background:rgba(44,90,160,.05) !important; border-color:var(--primary) !important; }
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="logo">
    <div class="logo-icon">📋</div>
    <div>
      <h1>إدارة المهام</h1>
      <p>لوحة التحكم الرئيسية</p>
    </div>
  </div>

  <div class="header-actions">
    <!-- تحميل -->
    <div class="export-wrap">
      <div class="icon-btn" onclick="toggleExport()" title="تحميل">📥</div>
      <div class="export-menu" id="exportMenu">
        <button class="export-item" onclick="downloadExcel()"><span>📊</span><span>تحميل Excel</span></button>
        <button class="export-item" onclick="downloadCSV()"><span>📄</span><span>تحميل CSV</span></button>
        <button class="export-item" onclick="downloadPDF()"><span>🖨️</span><span>تحميل PDF</span></button>
        <button class="export-item" onclick="uploadDrive()"><span>☁️</span><span>رفع Drive</span></button>
      </div>
    </div>
    <button class="btn btn-primary" onclick="openColModal()"><span>＋</span><span>عمود</span></button>
  </div>
</div>

<!-- STATS -->
<div class="stats-row" id="statsRow">
  <div class="stat s1"><div class="stat-icon">📋</div><div><div class="stat-num" id="sTotal">0</div><div class="stat-label">إجمالي المهام</div></div></div>
  <div class="stat s2"><div class="stat-icon">⏳</div><div><div class="stat-num" id="sPending">0</div><div class="stat-label">قيد التنفيذ</div></div></div>
  <div class="stat s3"><div class="stat-icon">✅</div><div><div class="stat-num" id="sDone">0</div><div class="stat-label">منجزة</div></div></div>
  <div class="stat s4"><div class="stat-icon">🔴</div><div><div class="stat-num" id="sHigh">0</div><div class="stat-label">أولوية عالية</div></div></div>
</div>

<!-- TOOLBAR -->
<div class="toolbar">
  <input class="search-box" id="searchBox" placeholder="🔍 ابحث عن مهمة...">
  <div class="filter-btns">
    <button class="fbtn active" onclick="setFilter('all',this)">الكل</button>
    <button class="fbtn" onclick="setFilter('pending',this)">⏳ معلقة</button>
    <button class="fbtn" onclick="setFilter('done',this)">✅ منجزة</button>
    <button class="fbtn" onclick="setFilter('high',this)">🔴 عالية</button>
  </div>
</div>

<!-- BOARD -->
<div class="board-wrap">
  <div class="board" id="board"></div>
</div>

<!-- Modal: عمود جديد -->
<div class="overlay" id="colModal" onclick="closeBg(event,'colModal')">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-head">
      <h3>عمود جديد</h3>
      <button class="modal-close" onclick="closeColModal()">✕</button>
    </div>
    <div class="form-group">
      <label class="form-label">اسم العمود</label>
      <input class="form-input" id="colName" placeholder="مثال: قيد التنفيذ">
    </div>
    <div class="form-group">
      <label class="form-label">اللون</label>
      <div class="color-grid" id="colorGrid"></div>
    </div>
    <button class="submit-btn" onclick="saveColumn()">إنشاء العمود</button>
  </div>
</div>

<!-- Modal: بطاقة جديدة -->
<div class="overlay" id="cardModal" onclick="closeBg(event,'cardModal')">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-head">
      <h3>مهمة جديدة</h3>
      <button class="modal-close" onclick="closeCardModal()">✕</button>
    </div>
    <div class="form-group">
      <label class="form-label">عنوان المهمة</label>
      <input class="form-input" id="cardTitle" placeholder="اكتب عنوان المهمة...">
    </div>
    <div class="form-group">
      <label class="form-label">الأولوية</label>
      <select class="form-input" id="cardPriority">
        <option value="medium">متوسطة</option>
        <option value="high">عالية 🔴</option>
        <option value="low">منخفضة</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">التاريخ</label>
      <input class="form-input" type="date" id="cardDate">
    </div>
    <div class="form-group">
      <label class="form-label">المسؤول</label>
      <input class="form-input" id="cardAssignee" placeholder="اسم المسؤول (اختياري)">
    </div>
    <button class="submit-btn" onclick="saveCard()">حفظ المهمة</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = window.location.origin;
const COLORS = ['#2c5aa0','#e74c3c','#27ae60','#f39c12','#9b59b6','#1abc9c','#e67e22','#16a085'];
let columns = [], allCards = [], curColId = null, selColor = '#2c5aa0', filterMode = 'all';

// ─── LOAD ───
async function load() {
  try {
    const [c, t] = await Promise.all([
      fetch(API+'/kanban/columns').then(r=>r.json()),
      fetch(API+'/tasks').then(r=>r.json())
    ]);
    columns = c; allCards = t;
    renderStats(); renderBoard();
  } catch(e) { toast('❌ خطأ في تحميل البيانات','err'); }
}

// ─── STATS ───
function renderStats() {
  const total = allCards.length;
  const done = allCards.filter(c=>c.done).length;
  const pending = allCards.filter(c=>!c.done).length;
  const high = allCards.filter(c=>c.priority==='high'&&!c.done).length;
  document.getElementById('sTotal').textContent = total;
  document.getElementById('sDone').textContent = done;
  document.getElementById('sPending').textContent = pending;
  document.getElementById('sHigh').textContent = high;
}

// ─── FILTER ───
let searchTerm = '';
function setFilter(mode, el) {
  filterMode = mode;
  document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  renderBoard();
}

document.getElementById('searchBox').addEventListener('input', e => {
  searchTerm = e.target.value.toLowerCase();
  renderBoard();
});

function filterCards(cards) {
  return cards.filter(c => {
    const matchSearch = !searchTerm || c.title.toLowerCase().includes(searchTerm);
    const matchFilter =
      filterMode === 'all' ? true :
      filterMode === 'pending' ? !c.done :
      filterMode === 'done' ? c.done :
      filterMode === 'high' ? c.priority === 'high' : true;
    return matchSearch && matchFilter;
  });
}

// ─── BOARD ───
function renderBoard() {
  const board = document.getElementById('board');

  let html = columns.map(col => {
    const colCards = (col.cards||[])
      .map(c => allCards.find(t=>t.id===c.id)).filter(Boolean);
    const filtered = filterCards(colCards);

    return `
    <div class="column" data-id="${col.id}">
      <div class="col-head">
        <div class="col-title">
          <div class="col-dot" style="background:${col.color||'#2c5aa0'}"></div>
          <div class="col-name" contenteditable="true" onblur="updateColName(${col.id},this.textContent)">${col.name}</div>
          <div class="col-count">${filtered.length}</div>
        </div>
        <div class="col-actions">
          <button class="col-btn" onclick="openCardModal(${col.id})">＋</button>
          <button class="col-btn del" onclick="deleteColumn(${col.id})">🗑</button>
        </div>
      </div>

      <div class="cards-area" data-col="${col.id}">
        ${filtered.length ? filtered.map(card => `
          <div class="card ${card.done?'done':''}" draggable="true" data-id="${card.id}">
            <div class="card-head">
              <div class="prio-dot prio-${card.priority||'medium'}"></div>
              <div class="card-title" style="${card.done?'text-decoration:line-through;opacity:.6':''}">${card.title}</div>
              <button class="card-del" onclick="deleteCard(${card.id})">✕</button>
            </div>
            <div class="card-meta">
              ${card.date ? `<span class="tag">📅 ${card.date}</span>` : ''}
              ${card.assignee ? `<span class="tag">👤 ${card.assignee}</span>` : ''}
              <span class="tag" onclick="toggleDone(${card.id})" style="cursor:pointer">
                ${card.done ? '↩ إلغاء' : '✓ إنجاز'}
              </span>
            </div>
          </div>
        `).join('') : `<div class="empty"><div class="empty-icon">📭</div><div>لا توجد مهام</div></div>`}
        <div class="add-card-btn" onclick="openCardModal(${col.id})">＋ مهمة جديدة</div>
      </div>
    </div>`;
  }).join('');

  html += `<div class="add-col-btn" onclick="openColModal()"><span>➕</span><span>عمود جديد</span></div>`;
  board.innerHTML = html;
  setupDrag();
}

// ─── COLUMN MODAL ───
function openColModal() {
  document.getElementById('colName').value = '';
  selColor = '#2c5aa0';
  document.getElementById('colorGrid').innerHTML = COLORS.map(c=>`
    <div class="color-opt ${c===selColor?'sel':''}" style="background:${c}" data-c="${c}" onclick="pickColor(this)"></div>
  `).join('');
  document.getElementById('colModal').classList.add('open');
  document.getElementById('colName').focus();
}
function closeColModal() { document.getElementById('colModal').classList.remove('open'); }
function pickColor(el) {
  document.querySelectorAll('.color-opt').forEach(e=>e.classList.remove('sel'));
  el.classList.add('sel'); selColor = el.dataset.c;
}
async function saveColumn() {
  const name = document.getElementById('colName').value.trim();
  if (!name) return;
  await fetch(API+'/kanban/columns',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,color:selColor})});
  toast('✅ تم إنشاء العمود'); closeColModal(); load();
}
async function updateColName(id, name) {
  name = name.trim(); if (!name) return;
  await fetch(API+`/kanban/columns/${id}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})});
}
async function deleteColumn(id) {
  if (!confirm('حذف العمود وكل مهامه؟')) return;
  await fetch(API+`/kanban/columns/${id}`,{method:'DELETE'});
  toast('🗑 تم حذف العمود','err'); load();
}

// ─── CARD MODAL ───
function openCardModal(colId) {
  curColId = colId;
  document.getElementById('cardTitle').value='';
  document.getElementById('cardDate').value='';
  document.getElementById('cardAssignee').value='';
  document.getElementById('cardPriority').value='medium';
  document.getElementById('cardModal').classList.add('open');
  document.getElementById('cardTitle').focus();
}
function closeCardModal() { document.getElementById('cardModal').classList.remove('open'); }
async function saveCard() {
  const title = document.getElementById('cardTitle').value.trim();
  if (!title || !curColId) return;
  await fetch(API+'/kanban/cards',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
    column_id:curColId, title,
    date:document.getElementById('cardDate').value||null,
    priority:document.getElementById('cardPriority').value,
    assignee:document.getElementById('cardAssignee').value||null
  })});
  toast('✅ تم إضافة المهمة'); closeCardModal(); load();
}
async function deleteCard(id) {
  if (!confirm('حذف المهمة؟')) return;
  await fetch(API+`/kanban/cards/${id}`,{method:'DELETE'});
  toast('🗑 حذف','err'); load();
}
async function toggleDone(id) {
  const card = allCards.find(c=>c.id===id);
  if (!card) return;
  await fetch(API+`/tasks/${id}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({done:!card.done})});
  load();
}

// ─── DRAG & DROP ───
let dragged = null;
function setupDrag() {
  document.querySelectorAll('.card').forEach(c=>{
    c.addEventListener('dragstart',e=>{ dragged=c; c.style.opacity='.4'; });
    c.addEventListener('dragend',e=>{ c.style.opacity='1'; dragged=null; });
  });
  document.querySelectorAll('.cards-area').forEach(a=>{
    a.addEventListener('dragover',e=>{ e.preventDefault(); a.classList.add('drag-over'); });
    a.addEventListener('dragleave',()=>a.classList.remove('drag-over'));
    a.addEventListener('drop',async e=>{
      e.preventDefault(); a.classList.remove('drag-over');
      if (!dragged) return;
      const cardId=parseInt(dragged.dataset.id);
      const colId=parseInt(a.dataset.col);
      await fetch(API+`/kanban/cards/${cardId}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({column_id:colId})});
      load();
    });
  });
}

// ─── EXPORT ───
function toggleExport() {
  document.getElementById('exportMenu').classList.toggle('open');
}
document.addEventListener('click', e=>{
  if (!e.target.closest('.export-wrap')) document.getElementById('exportMenu').classList.remove('open');
});

function makeCSV() {
  let csv='\uFEFF';
  csv+='العنوان,الأولوية,التاريخ,الحالة,المسؤول\n';
  allCards.forEach(t=>{
    csv+=`"${t.title}","${t.priority||''}","${t.date||''}","${t.done?'منجزة':'معلقة'}","${t.assignee||''}"\n`;
  });
  return csv;
}

function downloadCSV() {
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([makeCSV()],{type:'text/csv;charset=utf-8;'}));
  a.download='المهام.csv'; a.click();
  toast('📄 تم تحميل CSV'); document.getElementById('exportMenu').classList.remove('open');
}
function downloadExcel() {
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([makeCSV()],{type:'application/vnd.ms-excel'}));
  a.download='المهام.xlsx'; a.click();
  toast('📊 تم تحميل Excel'); document.getElementById('exportMenu').classList.remove('open');
}
function downloadPDF() {
  window.print();
  document.getElementById('exportMenu').classList.remove('open');
}
async function uploadDrive() {
  try {
    await fetch(API+'/export/google-drive',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({data:makeCSV()})});
    toast('☁️ تم الرفع على Drive');
  } catch(e) { toast('❌ خطأ في الرفع','err'); }
  document.getElementById('exportMenu').classList.remove('open');
}

// ─── MODAL BG ───
function closeBg(e, id) {
  if (e.target===e.currentTarget) document.getElementById(id).classList.remove('open');
}

// ─── TOAST ───
function toast(msg, type='ok') {
  const el=document.getElementById('toast');
  el.textContent=msg; el.className=`toast ${type} show`;
  setTimeout(()=>el.classList.remove('show'), 2500);
}

// ─── INIT ───
load();
setInterval(load, 30000);
</script>
</body>
</html>
