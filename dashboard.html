<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مهامي — لوحة المهام</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #6b5b95;
  --primary-light: #8b7bb8;
  --accent: #c9a876;
  --dark-bg: #1a1625;
  --card-bg: #2d2640;
  --card-hover: #3d3650;
  --text-primary: #f5f5f5;
  --text-secondary: #b8b8c8;
  --text-tertiary: #8a8a9a;
  --glass: rgba(255,255,255,0.04);
  --glass-hover: rgba(255,255,255,0.06);
  --transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  --success: #6fce72;
  --warning: #f5a623;
  --danger: #ff6b6b;
}

* { margin:0; padding:0; box-sizing:border-box; }

html, body {
  width:100%;
  height:100%;
  overflow-x:hidden;
}

body {
  font-family:'Tajawal',sans-serif;
  background:linear-gradient(135deg, var(--dark-bg) 0%, #251f35 100%);
  color:var(--text-primary);
  min-height:100vh;
  position:relative;
  background-attachment:fixed;
}

body::before {
  content:'';
  position:fixed;
  top:-50%;
  right:-50%;
  width:200%;
  height:200%;
  background:radial-gradient(circle at 20% 50%, rgba(107,91,149,0.1) 0%, transparent 50%),
             radial-gradient(circle at 80% 80%, rgba(201,168,118,0.08) 0%, transparent 50%);
  pointer-events:none;
  z-index:0;
  animation:drift 25s infinite linear;
}

@keyframes drift {
  0% { transform:translate(0, 0); }
  100% { transform:translate(30px, 30px); }
}

body::after {
  content:'';
  position:fixed;
  inset:0;
  background:radial-gradient(circle at center, transparent 0%, rgba(0,0,0,0.2) 100%);
  pointer-events:none;
  z-index:0;
}

.header {
  position:sticky;
  top:0;
  z-index:50;
  padding:24px 48px;
  background:linear-gradient(180deg, rgba(26,22,37,0.98) 0%, rgba(45,38,64,0.95) 100%);
  backdrop-filter:blur(30px);
  border-bottom:1px solid rgba(201,168,118,0.1);
  display:flex;
  align-items:center;
  gap:32px;
  justify-content:space-between;
  box-shadow:0 10px 40px rgba(0,0,0,0.3);
}

.logo-brand {
  display:flex;
  align-items:center;
  gap:16px;
  position:relative;
  z-index:2;
}

.logo-icon {
  width:56px;
  height:56px;
  border-radius:14px;
  background:linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:32px;
  box-shadow:0 10px 30px rgba(107,91,149,0.3);
  border:1px solid rgba(201,168,118,0.2);
}

.logo-text h1 {
  font-size:26px;
  font-weight:800;
  color:var(--text-primary);
  font-family:'Playfair Display',serif;
  letter-spacing:-1px;
}

.logo-text p {
  font-size:11px;
  color:var(--text-tertiary);
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:2px;
  margin-top:2px;
}

.header-controls {
  display:flex;
  align-items:center;
  gap:20px;
  margin-left:auto;
  position:relative;
  z-index:2;
}

.search-container {
  position:relative;
  width:300px;
}

.search-input {
  width:100%;
  background:var(--glass);
  border:1px solid rgba(201,168,118,0.15);
  border-radius:10px;
  padding:12px 18px 12px 44px;
  color:var(--text-primary);
  font-size:13px;
  outline:none;
  transition:var(--transition);
  backdrop-filter:blur(10px);
  direction:rtl;
}

.search-input::placeholder {
  color:var(--text-tertiary);
}

.search-input:focus {
  background:var(--glass-hover);
  border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(201,168,118,0.1);
}

.search-icon {
  position:absolute;
  right:14px;
  top:50%;
  transform:translateY(-50%);
  opacity:0.5;
}

.btn-luxury {
  background:linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
  border:none;
  border-radius:10px;
  padding:11px 28px;
  color:#fff;
  font-weight:700;
  font-size:12px;
  cursor:pointer;
  transition:var(--transition);
  box-shadow:0 8px 24px rgba(107,91,149,0.25);
  display:flex;
  align-items:center;
  gap:8px;
  white-space:nowrap;
  text-transform:uppercase;
  letter-spacing:0.8px;
}

.btn-luxury:hover {
  transform:translateY(-2px);
  box-shadow:0 12px 36px rgba(107,91,149,0.35);
}

.btn-icon {
  width:40px;
  height:40px;
  border-radius:10px;
  border:1px solid rgba(201,168,118,0.15);
  background:var(--glass);
  color:var(--accent);
  cursor:pointer;
  font-size:16px;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:var(--transition);
  backdrop-filter:blur(10px);
}

.btn-icon:hover {
  background:var(--glass-hover);
  border-color:var(--accent);
  transform:scale(1.05);
}

.premium-stats {
  padding:40px 48px;
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(200px, 1fr));
  gap:20px;
  position:relative;
  z-index:2;
  max-width:1400px;
  margin:0 auto;
}

.stat-box {
  background:var(--glass);
  border:1px solid rgba(201,168,118,0.15);
  border-radius:14px;
  padding:28px;
  cursor:pointer;
  transition:var(--transition);
  position:relative;
  overflow:hidden;
  backdrop-filter:blur(10px);
  display:flex;
  flex-direction:column;
  gap:12px;
}

.stat-box::before {
  content:'';
  position:absolute;
  top:0;
  left:0;
  right:0;
  height:2px;
  background:linear-gradient(90deg, var(--accent), transparent);
  opacity:0;
  transition:var(--transition);
}

.stat-box:hover {
  background:var(--glass-hover);
  border-color:var(--accent);
  transform:translateY(-4px);
  box-shadow:0 12px 36px rgba(107,91,149,0.15);
}

.stat-box:hover::before {
  opacity:1;
}

.stat-box.active {
  background:rgba(107,91,149,0.1);
  border-color:var(--accent);
  box-shadow:0 0 0 1px var(--accent);
}

.stat-label {
  font-size:11px;
  color:var(--text-tertiary);
  text-transform:uppercase;
  letter-spacing:1.5px;
  font-weight:700;
}

.stat-number {
  font-size:42px;
  font-weight:900;
  color:var(--accent);
  font-family:'Playfair Display',serif;
  letter-spacing:-1px;
}

.stat-desc {
  font-size:12px;
  color:var(--text-secondary);
}

.main-content {
  position:relative;
  z-index:2;
  padding:0 48px 60px;
  max-width:1400px;
  margin:0 auto;
}

.section-header {
  display:flex;
  align-items:center;
  gap:16px;
  margin-bottom:32px;
}

.section-icon {
  font-size:36px;
  filter:drop-shadow(0 4px 8px rgba(107,91,149,0.15));
}

.section-title {
  font-size:32px;
  font-weight:900;
  color:var(--text-primary);
  font-family:'Playfair Display',serif;
  letter-spacing:-1px;
}

.section-divider {
  flex:1;
  height:1px;
  background:linear-gradient(90deg, var(--accent) 0%, transparent);
  opacity:0.3;
}

.tasks-grid {
  display:grid;
  gap:16px;
}

.task-card {
  background:var(--glass);
  border:1px solid rgba(201,168,118,0.15);
  border-radius:12px;
  padding:24px;
  transition:var(--transition);
  position:relative;
  overflow:hidden;
  display:grid;
  grid-template-columns:auto 1fr auto;
  gap:16px;
  align-items:start;
  backdrop-filter:blur(10px);
}

.task-card:hover {
  background:var(--glass-hover);
  border-color:var(--accent);
  transform:translateX(-4px);
  box-shadow:0 12px 32px rgba(107,91,149,0.1);
}

.task-checkbox {
  width:24px;
  height:24px;
  border:2px solid var(--accent);
  border-radius:6px;
  background:transparent;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:var(--transition);
  flex-shrink:0;
  margin-top:2px;
}

.task-checkbox:hover {
  background:rgba(201,168,118,0.1);
  transform:scale(1.08);
}

.task-checkbox.done {
  background:var(--success);
  border-color:var(--success);
  color:#fff;
  font-size:14px;
}

.task-info {
  display:flex;
  flex-direction:column;
  gap:10px;
  position:relative;
  z-index:1;
}

.task-title {
  font-size:15px;
  font-weight:700;
  color:var(--text-primary);
  line-height:1.4;
  transition:var(--transition);
}

.task-card:hover .task-title {
  color:var(--accent);
}

.task-title.done {
  color:var(--text-tertiary);
  text-decoration:line-through;
  opacity:0.6;
}

.task-metadata {
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  align-items:center;
}

.task-date {
  display:inline-flex;
  align-items:center;
  gap:4px;
  font-size:11px;
  background:rgba(107,91,149,0.15);
  color:var(--text-secondary);
  padding:5px 10px;
  border-radius:6px;
  border:1px solid rgba(107,91,149,0.2);
  transition:var(--transition);
}

.task-date.overdue {
  background:rgba(255,107,107,0.15);
  color:#ff9999;
  border-color:rgba(255,107,107,0.25);
}

.task-date.today {
  background:rgba(201,168,118,0.15);
  color:var(--accent);
  border-color:rgba(201,168,118,0.25);
}

.task-type {
  display:inline-flex;
  font-size:9px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:1px;
  padding:4px 8px;
  border-radius:4px;
  background:rgba(107,91,149,0.15);
  color:var(--primary-light);
  border:1px solid rgba(107,91,149,0.2);
}

.task-actions {
  display:flex;
  gap:6px;
  opacity:0;
  transition:var(--transition);
}

.task-card:hover .task-actions {
  opacity:1;
}

.action-btn {
  width:32px;
  height:32px;
  border-radius:8px;
  border:1px solid rgba(201,168,118,0.15);
  background:var(--glass);
  color:var(--accent);
  cursor:pointer;
  font-size:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:var(--transition);
}

.action-btn:hover {
  background:var(--glass-hover);
  border-color:var(--accent);
  transform:scale(1.1);
}

.action-btn.delete:hover {
  background:rgba(255,107,107,0.15);
  color:#ff9999;
  border-color:rgba(255,107,107,0.25);
}

.empty-state {
  text-align:center;
  padding:80px 48px;
  background:var(--glass);
  border:1px solid rgba(201,168,118,0.15);
  border-radius:14px;
  backdrop-filter:blur(10px);
}

.empty-icon {
  font-size:72px;
  margin-bottom:20px;
  opacity:0.4;
}

.empty-text {
  font-size:20px;
  font-weight:700;
  margin-bottom:10px;
  color:var(--text-secondary);
}

.empty-desc {
  font-size:13px;
  color:var(--text-tertiary);
}

.modal-overlay {
  position:fixed;
  inset:0;
  background:linear-gradient(135deg, rgba(26,22,37,0.85), rgba(45,38,64,0.85));
  backdrop-filter:blur(10px);
  z-index:100;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal-overlay.show {
  display:flex;
  animation:fadeIn .3s ease;
}

@keyframes fadeIn {
  from { opacity:0; }
  to { opacity:1; }
}

.modal-box {
  background:linear-gradient(135deg, var(--card-bg) 0%, var(--card-hover) 100%);
  border:1px solid rgba(201,168,118,0.2);
  border-radius:16px;
  padding:40px;
  width:100%;
  max-width:480px;
  box-shadow:0 30px 80px rgba(0,0,0,0.4);
  position:relative;
  overflow:hidden;
  backdrop-filter:blur(10px);
  animation:modalIn .4s ease;
}

@keyframes modalIn {
  from { opacity:0; transform:scale(0.95) translateY(-30px); }
  to { opacity:1; transform:scale(1) translateY(0); }
}

.modal-header {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:28px;
}

.modal-title {
  font-size:24px;
  font-weight:900;
  color:var(--text-primary);
  font-family:'Playfair Display',serif;
}

.modal-close {
  width:40px;
  height:40px;
  border-radius:10px;
  border:1px solid rgba(201,168,118,0.15);
  background:var(--glass);
  color:var(--accent);
  cursor:pointer;
  font-size:22px;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:var(--transition);
}

.modal-close:hover {
  background:var(--glass-hover);
  border-color:var(--accent);
  transform:rotate(90deg);
}

.form-group {
  margin-bottom:20px;
}

.form-label {
  display:block;
  font-size:11px;
  font-weight:800;
  color:var(--accent);
  margin-bottom:8px;
  text-transform:uppercase;
  letter-spacing:1.5px;
}

.form-input, .form-select {
  width:100%;
  background:var(--glass);
  border:1px solid rgba(201,168,118,0.2);
  border-radius:10px;
  padding:12px 14px;
  color:var(--text-primary);
  font-family:'Tajawal',sans-serif;
  font-size:13px;
  outline:none;
  transition:var(--transition);
  backdrop-filter:blur(10px);
  direction:rtl;
}

.form-input:focus, .form-select:focus {
  background:var(--glass-hover);
  border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(201,168,118,0.1);
}

.form-row {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.form-row .form-group {
  margin-bottom:0;
}

.submit-btn {
  width:100%;
  background:linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
  border:none;
  border-radius:10px;
  padding:14px;
  color:#fff;
  font-weight:800;
  font-size:13px;
  cursor:pointer;
  transition:var(--transition);
  box-shadow:0 8px 24px rgba(107,91,149,0.25);
  text-transform:uppercase;
  letter-spacing:0.8px;
}

.submit-btn:hover {
  transform:translateY(-2px);
  box-shadow:0 12px 36px rgba(107,91,149,0.35);
}

.toast-notification {
  position:fixed;
  bottom:40px;
  right:40px;
  background:var(--glass);
  border:1px solid var(--accent);
  border-radius:10px;
  padding:16px 24px;
  color:var(--accent);
  font-size:13px;
  z-index:200;
  box-shadow:0 12px 36px rgba(107,91,149,0.2);
  display:none;
  align-items:center;
  gap:10px;
  backdrop-filter:blur(10px);
  animation:toastSlide .4s ease;
}

@keyframes toastSlide {
  from { opacity:0; transform:translateX(40px) translateY(40px); }
  to { opacity:1; transform:translateX(0) translateY(0); }
}

.toast-notification.show {
  display:flex;
}

::-webkit-scrollbar {
  width:8px;
}

::-webkit-scrollbar-track {
  background:transparent;
}

::-webkit-scrollbar-thumb {
  background:linear-gradient(180deg, var(--primary), var(--accent));
  border-radius:4px;
}

::-webkit-scrollbar-thumb:hover {
  box-shadow:0 0 0 1px rgba(201,168,118,0.2);
}
</style>
</head>
<body>

<div class="header">
  <div class="logo-brand">
    <div class="logo-icon">📋</div>
    <div class="logo-text">
      <h1>مهامي</h1>
      <p>إدارة المهام</p>
    </div>
  </div>

  <div class="header-controls">
    <div class="search-container">
      <span class="search-icon">🔍</span>
      <input type="text" class="search-input" id="searchInput" placeholder="ابحث..." oninput="filterTasks()">
    </div>
    <button class="btn-icon" onclick="location.href='/kanban'" title="Kanban">📋</button>
    <button class="btn-luxury" onclick="openNewTaskModal()">✨ جديد</button>
  </div>
</div>

<div class="premium-stats">
  <div class="stat-box active" onclick="setFilter('all')">
    <div class="stat-label">🎯 الكل</div>
    <div class="stat-number" id="stat-all">0</div>
    <div class="stat-desc">إجمالي</div>
  </div>

  <div class="stat-box" onclick="setFilter('today')">
    <div class="stat-label">📌 اليوم</div>
    <div class="stat-number" id="stat-today">0</div>
    <div class="stat-desc">مهام اليوم</div>
  </div>

  <div class="stat-box" onclick="setFilter('overdue')">
    <div class="stat-label">⚠️ متأخرة</div>
    <div class="stat-number" id="stat-overdue">0</div>
    <div class="stat-desc">عاجلة</div>
  </div>

  <div class="stat-box" onclick="setFilter('done')">
    <div class="stat-label">✅ منجزة</div>
    <div class="stat-number" id="stat-done">0</div>
    <div class="stat-desc">مكتملة</div>
  </div>
</div>

<div class="main-content">
  <div class="section-header">
    <div class="section-icon">📋</div>
    <h2 class="section-title">المهام</h2>
    <div class="section-divider"></div>
  </div>

  <div class="tasks-grid" id="tasksContainer"></div>
</div>

<div class="modal-overlay" id="taskModal" onclick="closeModalBg(event)">
  <div class="modal-box" onclick="event.stopPropagation()">
    <div class="modal-header">
      <h3 class="modal-title">مهمة جديدة</h3>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>

    <div class="form-group">
      <label class="form-label">العنوان</label>
      <input type="text" class="form-input" id="f-title" placeholder="اكتب المهمة...">
    </div>

    <div class="form-row">
      <div class="form-group">
        <label class="form-label">النوع</label>
        <select class="form-select" id="f-type">
          <option value="task">مهمة</option>
          <option value="meeting">اجتماع</option>
          <option value="reminder">تذكير</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">الأولوية</label>
        <select class="form-select" id="f-priority">
          <option value="low">منخفضة</option>
          <option value="normal">عادية</option>
          <option value="high">عالية</option>
        </select>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label class="form-label">التاريخ</label>
        <input type="date" class="form-input" id="f-date">
      </div>
      <div class="form-group">
        <label class="form-label">الوقت</label>
        <input type="time" class="form-input" id="f-time">
      </div>
    </div>

    <button class="submit-btn" onclick="submitTask()">إضافة</button>
  </div>
</div>

<div class="toast-notification" id="toast"></div>

<script>
const API = window.location.origin;
let allTasks = [];
let currentFilter = 'all';
let searchQuery = '';

async function loadTasks() {
  try {
    const res = await fetch(API + '/tasks');
    allTasks = await res.json();
    updateStats();
    renderTasks();
  } catch(e) {
    console.error('Error:', e);
  }
}

function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function updateStats() {
  const today = todayStr();
  const pending = allTasks.filter(t => !t.done);
  const todayTasks = pending.filter(t => t.date === today);
  const overdue = pending.filter(t => t.date && t.date < today);
  const done = allTasks.filter(t => t.done);

  document.getElementById('stat-all').textContent = allTasks.length;
  document.getElementById('stat-today').textContent = todayTasks.length;
  document.getElementById('stat-overdue').textContent = overdue.length;
  document.getElementById('stat-done').textContent = done.length;
}

function setFilter(f) {
  currentFilter = f;
  document.querySelectorAll('.stat-box').forEach(b => b.classList.remove('active'));
  event.target.closest('.stat-box')?.classList.add('active');
  renderTasks();
}

function filterTasks() {
  searchQuery = document.getElementById('searchInput').value.toLowerCase();
  renderTasks();
}

function getFilteredTasks() {
  let tasks = [...allTasks];
  const today = todayStr();

  if (currentFilter === 'today') {
    tasks = tasks.filter(t => !t.done && t.date === today);
  } else if (currentFilter === 'overdue') {
    tasks = tasks.filter(t => !t.done && t.date && t.date < today);
  } else if (currentFilter === 'done') {
    tasks = tasks.filter(t => t.done);
  } else {
    tasks = tasks.filter(t => !t.done);
  }

  if (searchQuery) {
    tasks = tasks.filter(t => t.title.toLowerCase().includes(searchQuery));
  }

  return tasks;
}

function renderTasks() {
  const tasks = getFilteredTasks();
  const container = document.getElementById('tasksContainer');

  if (tasks.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">📭</div>
        <div class="empty-text">لا توجد مهام</div>
        <div class="empty-desc">ابدأ بإضافة مهمة جديدة</div>
      </div>`;
    return;
  }

  container.innerHTML = tasks.map(t => {
    const today = todayStr();
    const isOverdue = !t.done && t.date && t.date < today;
    const isToday = t.date === today;
    const isDone = t.done;
    let dateClass = '';
    if (isOverdue) dateClass = 'overdue';
    else if (isToday) dateClass = 'today';

    return `
      <div class="task-card">
        <div class="task-checkbox ${isDone?'done':''}" 
          onclick="toggleTask(${t.id}, ${!isDone})"
          title="${isDone?'إلغاء':'إنجاز'}">
          ${isDone?'✓':''}
        </div>

        <div class="task-info">
          <div class="task-title ${isDone?'done':''}">
            ${t.title}
          </div>
          <div class="task-metadata">
            ${t.date ? `<div class="task-date ${dateClass}">📅 ${t.date.split('-')[2]}/${t.date.split('-')[1]}${t.time?' '+fmt12(t.time):''}}</div>` : ''}
            ${t.type === 'meeting' ? '<div class="task-type">📅 اجتماع</div>' : ''}
            ${t.type === 'reminder' ? '<div class="task-type">🔔 تذكير</div>' : ''}
          </div>
        </div>

        <div class="task-actions">
          <button class="action-btn" onclick="editTask(${t.id})" title="تعديل">✎</button>
          <button class="action-btn delete" onclick="deleteTask(${t.id})" title="حذف">🗑</button>
        </div>
      </div>`;
  }).join('');
}

function fmt12(t) {
  const [h,m] = t.split(':');
  return (h%12||12) + ':' + m + ' ' + (h<12?'ص':'م');
}

async function toggleTask(id, done) {
  await fetch(API + '/tasks/' + id, {
    method:'PATCH',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({done})
  });
  toast(done ? '✅ تم' : '↩️ إلغاء');
  loadTasks();
}

async function deleteTask(id) {
  if (!confirm('حذف المهمة؟')) return;
  await fetch(API + '/tasks/' + id, {method:'DELETE'});
  toast('🗑 تم الحذف');
  loadTasks();
}

function editTask(id) {
  alert('قريباً...');
}

function openNewTaskModal() {
  document.getElementById('f-title').value = '';
  document.getElementById('f-date').value = todayStr();
  document.getElementById('f-time').value = '';
  document.getElementById('f-type').value = 'task';
  document.getElementById('f-priority').value = 'normal';
  document.getElementById('taskModal').classList.add('show');
  document.getElementById('f-title').focus();
}

function closeModal() {
  document.getElementById('taskModal').classList.remove('show');
}

function closeModalBg(e) {
  if (e.target === e.currentTarget) closeModal();
}

async function submitTask() {
  const title = document.getElementById('f-title').value.trim();
  if (!title) return;

  const task = {
    title,
    type: document.getElementById('f-type').value,
    priority: document.getElementById('f-priority').value,
    date: document.getElementById('f-date').value,
    time: document.getElementById('f-time').value,
    done: false
  };

  await fetch(API + '/tasks', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(task)
  });

  toast('✅ تمت الإضافة');
  closeModal();
  loadTasks();
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2500);
}

loadTasks();
setInterval(loadTasks, 30000);
</script>
