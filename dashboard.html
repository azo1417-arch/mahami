<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مهامي — لوحة المهام</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1117;
    --col-bg: #1a1d27;
    --col-header: #22263a;
    --card-bg: #1e2235;
    --card-hover: #252a40;
    --border: rgba(255,255,255,0.06);
    --text: #e2e4f0;
    --text2: #8892b0;
    --text3: #4a5278;
    --accent: #6c63ff;
    --green: #2ecc71;
    --red: #e74c3c;
    --yellow: #f1c40f;
    --blue: #3498db;
    --orange: #e67e22;
    --pink: #e91e8c;
    --meeting: #4dabf7;
    --reminder: #ffd43b;
    --task: #69db7c;
    --urgent: #ff4757;
  }

  * { box-sizing:border-box; margin:0; padding:0; }

  body {
    font-family:'Tajawal',sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    overflow-x:auto;
  }

  /* ── Header ── */
  .header {
    display:flex;
    align-items:center;
    gap:16px;
    padding:14px 20px;
    background:rgba(108,99,255,0.12);
    border-bottom:1px solid rgba(108,99,255,0.2);
    position:sticky;
    top:0;
    z-index:100;
    backdrop-filter:blur(10px);
  }

  .logo { font-size:22px; font-weight:800; color:#fff; letter-spacing:-0.5px; }
  .logo span { color:var(--accent); }

  .header-stats { display:flex; gap:12px; margin-right:auto; }
  .hstat {
    background:rgba(255,255,255,0.06);
    border:1px solid var(--border);
    border-radius:8px;
    padding:5px 14px;
    font-size:12px;
    font-weight:600;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .hstat .num { font-size:16px; font-weight:800; }
  .hstat.blue .num { color:var(--accent); }
  .hstat.green .num { color:var(--green); }
  .hstat.red .num { color:var(--red); }
  .hstat.yellow .num { color:var(--yellow); }
  .hstat.active-filter {
    background:rgba(108,99,255,0.2);
    border:1px solid rgba(108,99,255,0.5);
    box-shadow:0 0 0 2px rgba(108,99,255,0.2);
  }
  .hstat { transition:all .2s; }
  .hstat:hover { transform:translateY(-1px); opacity:.9; }

  .btn-add-main {
    background:var(--accent);
    border:none;
    border-radius:10px;
    padding:8px 18px;
    color:#fff;
    font-family:'Tajawal',sans-serif;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:6px;
    transition:all .2s;
  }
  .btn-add-main:hover { background:#7c74ff; transform:translateY(-1px); }

  .search-wrap {
    position:relative;
  }
  .search-input {
    background:rgba(255,255,255,0.06);
    border:1px solid var(--border);
    border-radius:10px;
    padding:7px 14px 7px 36px;
    color:var(--text);
    font-family:'Tajawal',sans-serif;
    font-size:13px;
    outline:none;
    width:200px;
    transition:all .2s;
    direction:rtl;
  }
  .search-input:focus { border-color:var(--accent); width:250px; }
  .search-icon { position:absolute; left:10px; top:50%; transform:translateY(-50%); color:var(--text3); font-size:14px; }

  /* ── Board ── */
  .board {
    display:flex;
    gap:14px;
    padding:20px;
    min-height:calc(100vh - 56px);
    align-items:flex-start;
  }

  /* ── Column ── */
  .col {
    width:280px;
    flex-shrink:0;
    background:var(--col-bg);
    border-radius:14px;
    border:1px solid var(--border);
    display:flex;
    flex-direction:column;
    max-height:calc(100vh - 96px);
  }

  .col-header {
    padding:14px 16px 10px;
    display:flex;
    align-items:center;
    gap:8px;
    border-bottom:1px solid var(--border);
    flex-shrink:0;
  }

  .col-dot {
    width:10px;
    height:10px;
    border-radius:50%;
    flex-shrink:0;
  }

  .col-title { font-size:13px; font-weight:700; flex:1; letter-spacing:0.3px; }
  .col-count {
    background:rgba(255,255,255,0.08);
    border-radius:20px;
    padding:2px 8px;
    font-size:11px;
    font-weight:700;
    color:var(--text2);
    font-family:'JetBrains Mono',monospace;
  }

  .col-body {
    padding:10px;
    overflow-y:auto;
    flex:1;
    scrollbar-width:thin;
    scrollbar-color:rgba(255,255,255,0.1) transparent;
  }

  /* ── Card ── */
  .card {
    background:var(--card-bg);
    border:1px solid var(--border);
    border-radius:10px;
    padding:12px 14px;
    margin-bottom:8px;
    cursor:pointer;
    transition:all .2s;
    animation:cardIn .25s ease;
    position:relative;
    overflow:hidden;
  }

  @keyframes cardIn {
    from { opacity:0; transform:translateY(-6px); }
    to   { opacity:1; transform:translateY(0); }
  }

  .card:hover {
    background:var(--card-hover);
    border-color:rgba(108,99,255,0.3);
    transform:translateY(-2px);
    box-shadow:0 8px 24px rgba(0,0,0,0.3);
  }

  .card-accent-line {
    position:absolute;
    right:0; top:0; bottom:0;
    width:3px;
    border-radius:0 10px 10px 0;
  }

  .card-top { display:flex; align-items:flex-start; gap:8px; margin-bottom:8px; }
  .card-icon { font-size:16px; flex-shrink:0; margin-top:1px; }
  .card-title { font-size:13px; font-weight:600; line-height:1.4; flex:1; }
  .card-title.done-title { text-decoration:line-through; color:var(--text3); }

  .card-meta { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .badge {
    font-size:10px;
    font-weight:700;
    padding:2px 7px;
    border-radius:20px;
    display:inline-flex;
    align-items:center;
    gap:3px;
  }
  .badge-meeting { background:rgba(77,171,247,.15); color:var(--meeting); }
  .badge-task    { background:rgba(105,219,124,.15); color:var(--task); }
  .badge-reminder{ background:rgba(255,212,59,.15);  color:var(--reminder); }
  .badge-urgent  { background:rgba(255,71,87,.15);   color:var(--urgent); }
  .badge-visitor { background:rgba(108,99,255,.15);  color:var(--accent); }

  .card-time {
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--text2);
    margin-right:auto;
  }

  .card-date { font-size:11px; color:var(--text3); }

  .card-note {
    font-size:11px;
    color:var(--text2);
    margin-top:6px;
    padding-top:6px;
    border-top:1px solid var(--border);
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }

  .card-actions {
    display:flex;
    gap:6px;
    margin-top:8px;
    opacity:0;
    transition:opacity .2s;
  }
  .card:hover .card-actions { opacity:1; }

  .btn-sm {
    flex:1;
    background:rgba(255,255,255,0.05);
    border:1px solid var(--border);
    border-radius:7px;
    padding:5px 8px;
    color:var(--text2);
    font-family:'Tajawal',sans-serif;
    font-size:11px;
    font-weight:600;
    cursor:pointer;
    transition:all .15s;
    text-align:center;
  }
  .btn-sm:hover { color:var(--text); background:rgba(255,255,255,0.1); }
  .btn-sm.done:hover  { border-color:var(--green);  color:var(--green); }
  .btn-sm.del:hover   { border-color:var(--red);    color:var(--red); }
  .btn-sm.send:hover  { border-color:var(--green);  color:var(--green); }
  .btn-sm.edit2:hover { border-color:var(--accent); color:var(--accent); }

  /* countdown */
  .countdown {
    font-size:11px;
    font-weight:700;
    color:var(--yellow);
    display:inline-flex;
    align-items:center;
    gap:3px;
  }
  .countdown.soon { color:var(--urgent); animation:pulse 1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1}50%{opacity:.4} }

  /* add card btn */
  .add-card-btn {
    display:flex;
    align-items:center;
    gap:6px;
    padding:8px 10px;
    border-radius:8px;
    color:var(--text3);
    font-size:12px;
    font-weight:600;
    cursor:pointer;
    transition:all .15s;
    border:none;
    background:none;
    font-family:'Tajawal',sans-serif;
    width:100%;
    margin-top:4px;
  }
  .add-card-btn:hover { color:var(--text2); background:rgba(255,255,255,0.04); }

  /* ── Empty State ── */
  .empty-col { text-align:center; padding:30px 10px; color:var(--text3); }
  .empty-col .ei { font-size:32px; margin-bottom:8px; opacity:.5; }
  .empty-col p  { font-size:12px; }

  /* ── Requests Column ── */
  .request-card {
    background:rgba(108,99,255,0.08);
    border:1px solid rgba(108,99,255,0.2);
    border-radius:10px;
    padding:12px;
    margin-bottom:8px;
    transition:all .2s;
  }
  .request-card:hover { border-color:rgba(108,99,255,0.4); }
  .req-name { font-size:13px; font-weight:700; margin-bottom:4px; }
  .req-detail { font-size:12px; color:var(--text2); margin-bottom:8px; }
  .req-actions { display:flex; gap:6px; }
  .btn-approve {
    flex:1; background:rgba(46,204,113,.1); border:1px solid rgba(46,204,113,.3);
    color:var(--green); border-radius:7px; padding:5px; font-size:11px;
    font-weight:700; cursor:pointer; font-family:'Tajawal',sans-serif;
    transition:all .15s;
  }
  .btn-reject  {
    flex:1; background:rgba(231,76,60,.1);  border:1px solid rgba(231,76,60,.3);
    color:var(--red);  border-radius:7px; padding:5px; font-size:11px;
    font-weight:700; cursor:pointer; font-family:'Tajawal',sans-serif;
    transition:all .15s;
  }
  .btn-approve:hover { background:rgba(46,204,113,.2); }
  .btn-reject:hover  { background:rgba(231,76,60,.2); }

  /* ── Modal ── */
  .overlay {
    position:fixed; inset:0;
    background:rgba(0,0,0,.7);
    backdrop-filter:blur(6px);
    z-index:200;
    display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none;
    transition:opacity .2s;
  }
  .overlay.open { opacity:1; pointer-events:all; }
  .modal {
    background:#1e2235;
    border:1px solid var(--border);
    border-radius:18px;
    padding:28px;
    width:460px;
    max-width:95vw;
    transform:scale(.95);
    transition:transform .2s;
    box-shadow:0 24px 64px rgba(0,0,0,.5);
  }
  .overlay.open .modal { transform:scale(1); }
  .modal-title { font-size:18px; font-weight:800; margin-bottom:20px; display:flex; align-items:center; justify-content:space-between; }
  .close-btn { background:none; border:none; color:var(--text2); font-size:18px; cursor:pointer; }

  .form-group { margin-bottom:14px; }
  .form-label { display:block; font-size:11px; font-weight:700; color:var(--text2); margin-bottom:6px; text-transform:uppercase; letter-spacing:.5px; }
  .form-input, .form-select {
    width:100%;
    background:rgba(255,255,255,0.05);
    border:1px solid var(--border);
    border-radius:10px;
    padding:10px 14px;
    color:var(--text);
    font-family:'Tajawal',sans-serif;
    font-size:14px;
    outline:none;
    transition:border-color .15s;
    direction:rtl;
  }
  .form-input:focus, .form-select:focus { border-color:var(--accent); }
  .form-select option { background:#1e2235; }
  .form-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }

  .btn-save {
    width:100%;
    background:var(--accent);
    border:none;
    border-radius:10px;
    padding:12px;
    color:#fff;
    font-family:'Tajawal',sans-serif;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    margin-top:6px;
    transition:all .2s;
  }
  .btn-save:hover { background:#7c74ff; }

  /* Toast */
  .toast {
    position:fixed; bottom:24px; left:50%;
    transform:translateX(-50%) translateY(100px);
    background:#1e2235;
    border:1px solid var(--border);
    border-radius:12px;
    padding:12px 20px;
    font-size:13px;
    font-weight:600;
    z-index:999;
    transition:transform .3s;
    box-shadow:0 8px 24px rgba(0,0,0,.4);
  }
  .toast.show { transform:translateX(-50%) translateY(0); }
  .toast.ok  { border-color:rgba(46,204,113,.3); color:var(--green); }
  .toast.err { border-color:rgba(231,76,60,.3);  color:var(--red); }

  /* spinner */
  .spinner { width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;margin:30px auto; }
  @keyframes spin { to{transform:rotate(360deg)} }
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="logo">📋 <span>مهامي</span></div>

  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input class="search-input" type="text" placeholder="بحث..." id="searchInput" oninput="filterCards()">
  </div>

  <div class="header-stats">
    <div class="hstat" id="f-all"   onclick="setFilter('all')"     style="cursor:pointer"><span class="num" style="color:#aaa">كل</span> الكل</div>
    <div class="hstat blue active-filter" id="f-pending" onclick="setFilter('pending')" style="cursor:pointer"><span class="num" id="h-pending">—</span> معلقة</div>
    <div class="hstat green"  id="f-done"    onclick="setFilter('done')"    style="cursor:pointer"><span class="num" id="h-done">—</span> منجزة</div>
    <div class="hstat red"    id="f-overdue" onclick="setFilter('overdue')" style="cursor:pointer"><span class="num" id="h-overdue">—</span> متأخرة</div>
    <div class="hstat yellow" id="f-today"   onclick="setFilter('today')"   style="cursor:pointer"><span class="num" id="h-today">—</span> اليوم</div>
  </div>

  <button class="btn-add-main" onclick="openModal()">+ مهمة جديدة</button>

  <button onclick="location.href='/kanban'" style="background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:10px;padding:8px 14px;color:var(--text2);cursor:pointer;font-size:13px;font-family:'Tajawal',sans-serif;font-weight:600;">📋 Kanban</button>
  <button onclick="refreshAll()" style="background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:10px;padding:8px 14px;color:var(--text2);cursor:pointer;font-size:14px;">🔄</button>
</div>

<!-- Board -->
<div class="board" id="board">
  <!-- Columns rendered by JS -->
</div>

<!-- Modal -->
<div class="overlay" id="modal" onclick="closeModalBg(event)">
  <div class="modal">
    <div class="modal-title">
      <span id="modal-title-text">➕ مهمة جديدة</span>
      <button class="close-btn" onclick="closeModal()">✕</button>
    </div>
    <div class="form-group">
      <label class="form-label">العنوان</label>
      <input class="form-input" id="f-title" placeholder="عنوان المهمة...">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">النوع</label>
        <select class="form-select" id="f-type">
          <option value="task">✅ مهمة</option>
          <option value="meeting">📅 اجتماع</option>
          <option value="reminder">🔔 تذكير</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">الأولوية</label>
        <select class="form-select" id="f-priority">
          <option value="normal">عادي</option>
          <option value="urgent">🔴 عاجل</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">التاريخ</label>
        <input class="form-input" type="date" id="f-date">
      </div>
      <div class="form-group">
        <label class="form-label">الوقت</label>
        <input class="form-input" type="time" id="f-time">
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">ملاحظة</label>
      <input class="form-input" id="f-note" placeholder="ملاحظة اختيارية...">
    </div>
    <button class="btn-save" onclick="saveTask()">حفظ ✓</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = window.location.origin;
let allTasks = [], allRequests = [];
let editingId = null;

// ── Column Definitions ──────────────────────────────────────────────────────
const COLUMNS = [
  { id:'overdue',  title:'⚠️ متأخرة',   dot:'#ff4757', color:'#ff4757' },
  { id:'today',    title:'📌 اليوم',     dot:'#6c63ff', color:'#6c63ff' },
  { id:'upcoming', title:'🗓️ القادمة',  dot:'#4dabf7', color:'#4dabf7' },
  { id:'requests', title:'📬 طلبات الزوار', dot:'#f1c40f', color:'#f1c40f' },
  { id:'done',     title:'✅ المنجزة',   dot:'#2ecc71', color:'#2ecc71' },
];

// ── Init ────────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', function() {
  document.getElementById('f-date').value = new Date().toLocaleDateString('en-CA');
  renderBoard();
  refreshAll();
  setInterval(refreshAll, 30000);
  setInterval(updateCountdowns, 60000);
});

function todayStr() {
  return new Date().toLocaleDateString('en-CA', { timeZone:'Asia/Riyadh' });
}

function fmt12(t) {
  if (!t) return '';
  const [h,m] = t.split(':').map(Number);
  return (h%12||12) + ':' + String(m).padStart(2,'0') + ' ' + (h<12?'ص':'م');
}

function countdown(task) {
  if (!task.time || task.done) return '';
  const dt = new Date(task.date + 'T' + task.time);
  const diff = dt - new Date();
  if (diff <= 0 || diff > 86400000) return '';
  const h = Math.floor(diff/3600000);
  const m = Math.floor((diff%3600000)/60000);
  const soon = diff < 3600000;
  return `<span class="countdown ${soon?'soon':''}">⏳ ${h>0?h+'س ':''}${m}د</span>`;
}

// ── Load Data ───────────────────────────────────────────────────────────────
async function refreshAll() {
  try {
    const [tasksRes, reqRes] = await Promise.all([
      fetch(API + '/tasks'),
      fetch(API + '/appointment-requests')
    ]);
    allTasks    = await tasksRes.json();
    allRequests = await reqRes.json();
    renderBoard();
    updateStats();
  } catch(e) { console.error(e); }
}

// ── Stats ────────────────────────────────────────────────────────────────────
function updateStats() {
  const today = todayStr();
  const pending = allTasks.filter(t => !t.done);
  const done    = allTasks.filter(t => t.done);
  const overdue = pending.filter(t => t.date && t.date < today);
  const todayT  = pending.filter(t => t.date === today);
  document.getElementById('h-pending').textContent = pending.length;
  document.getElementById('h-done').textContent    = done.length;
  document.getElementById('h-overdue').textContent = overdue.length;
  document.getElementById('h-today').textContent   = todayT.length;
}

// ── Render Board ─────────────────────────────────────────────────────────────
function renderBoard() {
  const board = document.getElementById('board');
  const today = todayStr();
  const q     = document.getElementById('searchInput').value.toLowerCase();

  const filtered = allTasks.filter(t =>
    !q || t.title.toLowerCase().includes(q) || (t.note||'').toLowerCase().includes(q)
  );

  // تطبيق الفلتر
  let displayTasks = filtered;
  if (activeFilter === 'pending') {
    displayTasks = filtered.filter(t => !t.done);
  } else if (activeFilter === 'done') {
    displayTasks = filtered.filter(t => t.done);
  } else if (activeFilter === 'overdue') {
    displayTasks = filtered.filter(t => !t.done && t.date && t.date < today);
  } else if (activeFilter === 'today') {
    displayTasks = filtered.filter(t => !t.done && t.date === today);
  }

  const groups = {
    overdue:  displayTasks.filter(t => !t.done && t.date && t.date < today),
    today:    displayTasks.filter(t => !t.done && t.date === today),
    upcoming: displayTasks.filter(t => !t.done && (!t.date || t.date > today)),
    requests: (activeFilter === 'all' || activeFilter === 'pending')
      ? allRequests.filter(r => r.status === 'pending' || r.status === 'awaiting_visitor_confirm')
      : [],
    done:     displayTasks.filter(t => t.done).slice(0,20),
  };

  board.innerHTML = COLUMNS.map(col => `
    <div class="col" id="col-${col.id}">
      <div class="col-header">
        <div class="col-dot" style="background:${col.dot}"></div>
        <div class="col-title">${col.title}</div>
        <div class="col-count">${col.id==='requests' ? groups.requests.length : groups[col.id].length}</div>
      </div>
      <div class="col-body" id="body-${col.id}">
        ${col.id === 'requests' ? renderRequests(groups.requests) : renderCards(groups[col.id], col)}
        ${col.id !== 'requests' && col.id !== 'done' ? `<button class="add-card-btn" onclick="openModal()">+ إضافة مهمة</button>` : ''}
      </div>
    </div>
  `).join('');
}

function renderCards(tasks, col) {
  if (!tasks.length) return `<div class="empty-col"><div class="ei">${col.id==='done'?'🎉':'📭'}</div><p>${col.id==='done'?'لا توجد منجزة':'لا توجد مهام'}</p></div>`;
  return tasks.map(t => cardHTML(t, col)).join('');
}

function cardHTML(t, col) {
  const typeIcon  = t.type==='meeting'?'📅':t.type==='reminder'?'🔔':'✅';
  const typeBadge = t.type==='meeting'?'badge-meeting':t.type==='reminder'?'badge-reminder':'badge-task';
  const typeLabel = t.type==='meeting'?'اجتماع':t.type==='reminder'?'تذكير':'مهمة';
  const accentClr = t.type==='meeting'?'var(--meeting)':t.type==='reminder'?'var(--reminder)':'var(--task)';
  const urgentBadge = t.priority==='urgent' ? `<span class="badge badge-urgent">🔴 عاجل</span>` : '';
  const visitorBadge = t.requested_by_name ? `<span class="badge badge-visitor">👤 ${t.requested_by_name}</span>` : '';
  const cd = countdown(t);

  return `
    <div class="card" onclick="openEdit(${t.id})">
      <div class="card-accent-line" style="background:${t.priority==='urgent'?'var(--urgent)':accentClr}"></div>
      <div class="card-top">
        <div class="card-icon">${typeIcon}</div>
        <div class="card-title ${t.done?'done-title':''}">${t.title}</div>
      </div>
      <div class="card-meta">
        <span class="badge ${typeBadge}">${typeLabel}</span>
        ${urgentBadge}
        ${visitorBadge}
        ${t.time ? `<span class="card-time">${fmt12(t.time)}</span>` : ''}
        ${cd}
        ${t.date ? `<span class="card-date">${t.date}</span>` : ''}
      </div>
      ${t.note ? `<div class="card-note">📝 ${t.note}</div>` : ''}
      <div class="card-actions">
        ${!t.done ? `<button class="btn-sm done" onclick="event.stopPropagation();doneTask(${t.id})">✓ إنجاز</button>` : `<button class="btn-sm" onclick="event.stopPropagation();undoTask(${t.id})">↩ رجوع</button>`}
        <button class="btn-sm send" onclick="event.stopPropagation();sendReminder(${t.id})">🔔</button>
        <button class="btn-sm del"  onclick="event.stopPropagation();delTask(${t.id})">🗑</button>
      </div>
    </div>`;
}

function renderRequests(reqs) {
  if (!reqs.length) return `<div class="empty-col"><div class="ei">📭</div><p>لا توجد طلبات</p></div>`;
  return reqs.map(r => `
    <div class="request-card">
      <div class="req-name">👤 ${r.name||r.requested_by_name}</div>
      <div class="req-detail">
        ${r.title||r.task_title||''}
        ${r.proposed_date||r.date ? `<br>📅 ${r.proposed_date||r.date} ${r.proposed_time||r.time ? '⏰ '+fmt12(r.proposed_time||r.time) : ''}` : ''}
      </div>
      <div class="req-actions">
        <button class="btn-approve" onclick="approveReq(${r.id},'${r.name||r.requested_by_name}')">✅ قبول</button>
        <button class="btn-reject"  onclick="rejectReq(${r.id},'${r.name||r.requested_by_name}')">❌ رفض</button>
      </div>
    </div>`).join('');
}

// ── Search ──────────────────────────────────────────────────────────────────
let activeFilter = 'pending';

function setFilter(f) {
  activeFilter = f;
  // إزالة active من الكل
  ['all','pending','done','overdue','today'].forEach(function(id) {
    const el = document.getElementById('f-'+id);
    if (el) el.classList.remove('active-filter');
  });
  const active = document.getElementById('f-'+f);
  if (active) active.classList.add('active-filter');
  renderBoard();
}

function filterCards() { renderBoard(); }

// ── Countdown Update ─────────────────────────────────────────────────────────
function updateCountdowns() { renderBoard(); }

// ── CRUD ─────────────────────────────────────────────────────────────────────
async function doneTask(id) {
  await fetch(API+'/tasks/'+id, { method:'PATCH', headers:{'Content-Type':'application/json'}, body:JSON.stringify({done:true}) });
  toast('✅ تم الإنجاز!','ok'); refreshAll();
}
async function undoTask(id) {
  await fetch(API+'/tasks/'+id, { method:'PATCH', headers:{'Content-Type':'application/json'}, body:JSON.stringify({done:false}) });
  toast('↩ تم الإرجاع','ok'); refreshAll();
}
async function delTask(id) {
  if (!confirm('تأكيد الحذف؟')) return;
  await fetch(API+'/tasks/'+id, { method:'DELETE' });
  toast('🗑 تم الحذف','err'); refreshAll();
}
async function sendReminder(id) {
  await fetch(API+'/tasks/'+id+'/send', { method:'POST' });
  toast('🔔 تم الإرسال!','ok');
}
async function approveReq(id, name) {
  await fetch(API+'/tasks/'+id, { method:'PATCH', headers:{'Content-Type':'application/json'}, body:JSON.stringify({status:'approved'}) });
  toast('✅ تم قبول طلب '+name,'ok'); refreshAll();
}
async function rejectReq(id, name) {
  await fetch(API+'/tasks/'+id, { method:'PATCH', headers:{'Content-Type':'application/json'}, body:JSON.stringify({status:'rejected'}) });
  toast('❌ تم رفض طلب '+name,'err'); refreshAll();
}

// ── Modal ────────────────────────────────────────────────────────────────────
function openModal() {
  editingId = null;
  document.getElementById('modal-title-text').textContent = '➕ مهمة جديدة';
  document.getElementById('f-title').value = '';
  document.getElementById('f-type').value = 'task';
  document.getElementById('f-priority').value = 'normal';
  document.getElementById('f-date').value = new Date().toLocaleDateString('en-CA');
  document.getElementById('f-time').value = '';
  document.getElementById('f-note').value = '';
  document.getElementById('modal').classList.add('open');
}

function openEdit(id) {
  const t = allTasks.find(t => t.id == id);
  if (!t) return;
  editingId = id;
  document.getElementById('modal-title-text').textContent = '✏️ تعديل المهمة';
  document.getElementById('f-title').value    = t.title;
  document.getElementById('f-type').value     = t.type;
  document.getElementById('f-priority').value = t.priority||'normal';
  document.getElementById('f-date').value     = t.date||'';
  document.getElementById('f-time').value     = t.time||'';
  document.getElementById('f-note').value     = t.note||'';
  document.getElementById('modal').classList.add('open');
}

function closeModal() { document.getElementById('modal').classList.remove('open'); }
function closeModalBg(e) { if (e.target===e.currentTarget) closeModal(); }

async function saveTask() {
  const title = document.getElementById('f-title').value.trim();
  const date  = document.getElementById('f-date').value;
  const time  = document.getElementById('f-time').value;
  if (!title || !date) { toast('⚠️ أدخل العنوان والتاريخ','err'); return; }
  const body = {
    title,
    type:     document.getElementById('f-type').value,
    priority: document.getElementById('f-priority').value,
    date, time,
    note:     document.getElementById('f-note').value,
  };
  if (editingId) {
    await fetch(API+'/tasks/'+editingId, { method:'PATCH', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) });
    toast('✅ تم التعديل!','ok');
  } else {
    await fetch(API+'/tasks', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) });
    toast('✅ تمت الإضافة!','ok');
  }
  closeModal(); refreshAll();
}

// ── Toast ────────────────────────────────────────────────────────────────────
function toast(msg, type='ok') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast '+type+' show';
  setTimeout(() => el.classList.remove('show'), 3000);
}
